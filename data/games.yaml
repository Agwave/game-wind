# 游戏→上市公司映射表（只收录 A 股上市公司 + 港股通标的港股）
#
# 匹配规则（按优先级）：
#   1. ids       —— App Store app_id 精确匹配（同一游戏跨地区是同一 id，或同游戏多地区不同 id 都列出）
#   2. names     —— 与榜单标题完全相等
#   3. contains  —— 标题包含该子串（用于苹果标题带版本后缀等不确定的情况）
#
# core: true 标记该游戏为公司核心业绩支撑游戏（财报/畅销榜佐证的收入主力），
# 供报告对核心游戏变动优先关注；新加入的核心游戏以 name-only 条目入库，等它们上榜时生效。
#
# 维护建议：报告中的「未映射新进游戏」清单会给出 app_id，把 id 加进对应游戏即可，
# 匹配会自动生效（id 匹配跨地区稳定，不受本地化标题影响）。
#
# ids/names 均来自 2026-08-18 真实榜单抓取；未上过榜的游戏为 name-only 条目，等它们上榜时生效。
#
# 无关发行商名单：确认非目标上市公司的发行商。榜单上命中 Artist（开发者账号名）的游戏
# 视为无关，报告归到「无关公司」，其变动不再单独提及。可用「补充·待确认」持续补充。
# 注意：不要加入 Century（世纪华通出海品牌，属于目标公司）。
unrelated_artists:
  - Nintendo
  - miHoYo
  - Supercell
  - Playrix
  - King
  - Roblox
  - Netmarble
  - Nexon
  - Krafton
  - Konami
  - Bandai Namco
  - Square Enix
  - Capcom
  - SEGA
  - IronSource
  - Voodoo
